name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      services:
        description: "Services to deploy"
        required: true
        type: choice
        options:
          - all
          - api
          - web
          - workflows
      release_rollback_action:
        description: "release.rollback_action metadata; required for production deploys"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-release-metadata:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    env:
      RELEASE_ROLLBACK_ACTION: ${{ inputs.release_rollback_action }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Require production rollback action
        run: |
          if [[ "$TARGET_ENVIRONMENT" != "production" ]]; then
            echo "release.rollback_action is optional for $TARGET_ENVIRONMENT deploys." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ -z "${RELEASE_ROLLBACK_ACTION//[[:space:]]/}" ]]; then
            echo "::error title=Missing release.rollback_action::Production Cloudflare deploys require explicit release.rollback_action metadata."
            echo "Provide the exact rollback command path for the affected Worker versions before retrying."
            exit 1
          fi

          {
            echo "### release.rollback_action"
            echo
            echo '```'
            echo "$RELEASE_ROLLBACK_ACTION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify Before Deploy
    needs: validate-release-metadata
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Verify core quality gates
        run: npm run verify:core

  deploy:
    name: Deploy ${{ inputs.services }} to ${{ inputs.environment }}
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: cloudflare-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      WEB_APP_URL: ${{ vars.WEB_APP_URL }}
      API_HEALTHCHECK_URL: ${{ vars.API_HEALTHCHECK_URL }}
      WORKFLOWS_HEALTHCHECK_URL: ${{ vars.WORKFLOWS_HEALTHCHECK_URL }}
      WORKFLOWS_HEALTHCHECK_TOKEN: ${{ secrets.WORKFLOWS_HEALTHCHECK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Validate deploy variables
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$WEB_APP_URL"
          test -n "$API_HEALTHCHECK_URL"
          if [[ "${{ inputs.services }}" == "all" || "${{ inputs.services }}" == "web" ]]; then
            test -n "$NEXT_PUBLIC_API_URL"
          fi
      - name: Deploy API
        if: ${{ inputs.services == 'all' || inputs.services == 'api' }}
        run: npm run deploy:api:${{ inputs.environment }}
      - name: Deploy Web
        if: ${{ inputs.services == 'all' || inputs.services == 'web' }}
        run: npm run deploy:web:${{ inputs.environment }}
      - name: Deploy Workflows
        if: ${{ inputs.services == 'all' || inputs.services == 'workflows' }}
        run: npm run deploy:workflows:${{ inputs.environment }}
      - name: Post-deploy smoke checks
        run: npm run smoke:cloudflare
      - name: Rollback reminder
        env:
          RELEASE_ROLLBACK_ACTION: ${{ inputs.release_rollback_action }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ "$TARGET_ENVIRONMENT" == "production" ]]; then
            echo "If smoke checks or manual verification fail, run the approved release.rollback_action:"
            echo "$RELEASE_ROLLBACK_ACTION"
          else
            echo "If smoke checks or manual verification fail, redeploy the last known-good staging Worker version or restore the previous artifact/config revision."
          fi
