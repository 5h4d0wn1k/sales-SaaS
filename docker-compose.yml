services:
  postgres:
    image: postgres:16-alpine
    container_name: sales-saas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_aaas
      POSTGRES_USER: sales_saas
      POSTGRES_PASSWORD: sales_saas
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
